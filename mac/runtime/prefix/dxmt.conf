# DXMT configuration for PEAK (read via DXMT_CONFIG_FILE, set by pp-env.sh).
# Option names from DXMT's dxmt.conf (v0.80). Per-run overrides: PP_DXMT_CONFIG="key=value;..."
# Every value here is a G-A2 tuning knob (docs/TUNING.md); defaults are DXMT's own unless noted.

# Frame limiter paced by Metal/CoreAnimation. PEAK's Mac preset caps at 60 too (FPSCapSetting);
# keeping both at 60 avoids uneven pacing on 60 Hz MacBook Air panels.
d3d11.preferredMaxFrameRate = 60

# MetalFX spatial upscaling of the swapchain needs DXMT_METALFX_SPATIAL_SWAPCHAIN=1 in the
# environment; factor applies only then. Tuning row R4.
# d3d11.metalSpatialUpscaleFactor = 1.5

# Leave the rest at DXMT defaults:
# d3d11.maxFeatureLevel = 12_1
# d3d11.maxTessFactor = 64
# dxgi.forceSDR = True
# dxgi.handleAltTab = True
