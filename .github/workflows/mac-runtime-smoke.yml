# Quick smoke test of an EXISTING runtime artifact (no rebuild): downloads peakpack-runtime-<id> from a
# finished mac-runtime run, creates a throwaway prefix with the checked-out prefix scripts and runs a few
# Windows programs, with Wine debug channels on. Minutes instead of hours per iteration.
# Repo path when pushed: .github/workflows/mac-runtime-smoke.yml. Manual only; read-only; no releases.
name: mac-runtime-smoke

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "mac-runtime run id whose artifact to test"
        required: true
        type: string
      runtime_id:
        description: "RUNTIME_ID (artifact peakpack-runtime-<id>)"
        type: string
        default: "pp1-cx26.3.0"
      runner:
        description: "macOS runner"
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15   # Apple Silicon + Rosetta (the Intel VM has no usable Metal device)
      peakpack_tag:
        description: "Release whose PeakPack.exe the PeakPack step runs (rev-N or mac-build-peakpack-*)"
        type: string
        default: "rev-5"
      wine_debug:
        description: "WINEDEBUG for the diagnostic runs"
        type: string
        default: "err+all,+loaddll,+seh,+module"

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUN_ID: ${{ inputs.run_id }}
      RID: ${{ inputs.runtime_id }}
      DBG: ${{ inputs.wine_debug }}
      PPTAG: ${{ inputs.peakpack_tag }}
    steps:
      - name: Validate inputs
        run: |
          case "$RUN_ID" in (*[!0-9]*|"") echo "::error::bad run_id"; exit 1;; esac
          case "$RID" in (*[!A-Za-z0-9._-]*|"") echo "::error::bad runtime_id"; exit 1;; esac
          case "$DBG" in (*[!A-Za-z0-9,+._-]*) echo "::error::bad wine_debug"; exit 1;; esac
          case "$PPTAG" in (rev-[0-9]*|mac-build-peakpack-*) ;; (*) echo "::error::bad peakpack_tag"; exit 1;; esac
          case "$PPTAG" in (*[!A-Za-z0-9._-]*) echo "::error::bad peakpack_tag"; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: mac/runtime
          persist-credentials: false
      - name: Rosetta (arm64 runner only)
        run: |
          if [ "$(uname -m)" = arm64 ]; then sudo softwareupdate --install-rosetta --agree-to-license; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: peakpack-runtime-${{ inputs.runtime_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: art
      - name: Unpack the runtime (absolute path)
        run: |
          set -euo pipefail
          (cd art && shasum -a 256 -c "peakpack-runtime-$RID-x86_64.tar.xz.sha256")
          mkdir -p "$RUNNER_TEMP/rt"
          tar -xJf "art/peakpack-runtime-$RID-x86_64.tar.xz" -C "$RUNNER_TEMP/rt"
          cat art/BUILD-STATUS.txt || true
          R="$RUNNER_TEMP/rt/$RID"
          echo "R=$R" >> "$GITHUB_ENV"
          find "$R/lib/wine/x86_64-windows" -maxdepth 1 -name '*.dll' | wc -l
          ls -l "$R/lib/wine/x86_64-windows/kernel32.dll" "$R/lib/wine/x86_64-unix/ntdll.so"
          # Use the checked-out (newer) prefix scripts, not the copy packed in the runtime.
          rm -rf "$R/share/peakpack/prefix" && cp -R mac/runtime/prefix "$R/share/peakpack/prefix"
          chmod +x "$R"/share/peakpack/prefix/*.sh
      - name: Static diagnostics (PE imports/builtin marker, Mach-O load commands)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set +e -uo pipefail
          mkdir -p logs
          {
            echo "== machine"; uname -m; sw_vers; sysctl -n machdep.cpu.brand_string
            system_profiler SPDisplaysDataType 2>/dev/null | grep -E "Chipset|Metal|Vendor|Type" | head -10
            echo "== pe_check"; python3 mac/runtime/build/pe_check.py "$R/lib/wine"; echo "pe_check exit $?"
            echo "== bin"; ls -la "$R/bin"
            echo "== lib/wine"; ls -la "$R/lib/wine"
            echo "== x86_64-unix"; ls -la "$R/lib/wine/x86_64-unix"
            echo "== i386-windows count"; ls "$R/lib/wine/i386-windows" | wc -l
            for f in "$R/bin/wine" "$R/lib/wine/x86_64-unix/wine" "$R/bin/wineserver" "$R/lib/wine/x86_64-unix/ntdll.so"; do
              echo "== $f"; file "$f"; otool -L "$f"
              otool -l "$f" | grep -A3 -E 'LC_RPATH|LC_SEGMENT_64' | grep -E 'cmd|path|segname|vmaddr|vmsize' | head -40
              codesign -dv "$f" 2>&1 | head -5
            done
            echo "== kernel32 dos stub"; xxd -s 64 -l 32 "$R/lib/wine/x86_64-windows/kernel32.dll"
          } > logs/static.log 2>&1
          cat logs/static.log | head -150
      - name: Raw Wine start (no PeakPack scripts) with WINEDEBUG
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set +e -uo pipefail
          mkdir -p logs
          export WINEPREFIX="$RUNNER_TEMP/pfx-raw" WINEDEBUG="$DBG,+process" WINEDLLOVERRIDES="mscoree,mshtml=;winemenubuilder.exe=d"
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # macOS has no timeout(1)
          to 120 "$R/bin/wine" wineboot --init > logs/raw-wineboot.log 2>&1; echo "raw wineboot exit $?"
          "$R/bin/wineserver" -k 2>/dev/null || true
          WINEMSYNC=0 WINEESYNC=0 WINEPREFIX="$RUNNER_TEMP/pfx-raw-nosync" \
            to 120 "$R/bin/wine" wineboot --init > logs/raw-wineboot-nosync.log 2>&1
          echo "raw (no msync) exit $?"
          WINEPREFIX="$RUNNER_TEMP/pfx-raw-nosync" "$R/bin/wineserver" -k 2>/dev/null || true
          WINEDLLPATH="$R/lib/wine" WINEPREFIX="$RUNNER_TEMP/pfx-raw-dllpath" \
            to 120 "$R/bin/wine" wineboot --init > logs/raw-wineboot-dllpath.log 2>&1
          echo "raw (WINEDLLPATH) exit $?"
          WINEPREFIX="$RUNNER_TEMP/pfx-raw-dllpath" "$R/bin/wineserver" -k 2>/dev/null || true
          WINEPREFIX="$RUNNER_TEMP/pfx-raw-cmd" to 120 "$R/bin/wine" cmd /c ver > logs/raw-cmd.log 2>&1; echo "raw cmd exit $?"
          WINEPREFIX="$RUNNER_TEMP/pfx-raw-cmd" "$R/bin/wineserver" -k 2>/dev/null || true
          for l in logs/raw-*.log; do
            # cap runaway logs (exception loops): keep the first 20 MB and the last 1 MB
            if [ "$(wc -c < "$l")" -gt 25000000 ]; then
              { head -c 20000000 "$l"; echo; echo '[... truncated ...]'; tail -c 1000000 "$l"; } > "$l.cut" && mv "$l.cut" "$l"
            fi
            echo "== $l"
            grep -a -v -E '^\s+VK_|Vulkan extensions are supported' "$l" \
              | grep -a -E 'err:|seh:|could not|exception|Loaded L|NtCreateUserProcess L' | tail -n 60
          done
      - name: verify_runtime --smoke (absolute runtime path)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 8
        run: mac/runtime/build/verify_runtime.sh "$R" --smoke
      - name: Diagnostic prefix creation with WINEDEBUG (absolute and relative paths)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e -uo pipefail
          mkdir -p logs
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          PP_WINEDEBUG="$DBG" to 180 bash "$R/share/peakpack/prefix/pp-create-prefix.sh" "$R" "$RUNNER_TEMP/pfx-abs" \
            > logs/create-abs.log 2>&1
          echo "absolute: exit $?"
          rel="$(python3 -c 'import os,sys; print(os.path.relpath(sys.argv[1]))' "$R")"
          "$R/bin/wineserver" -k 2>/dev/null || true
          PP_WINEDEBUG="$DBG" to 180 bash "$R/share/peakpack/prefix/pp-create-prefix.sh" "$rel" "pfx-rel" > logs/create-rel.log 2>&1
          echo "relative ($rel): exit $?"
          "$R/bin/wineserver" -k 2>/dev/null || true
          for l in logs/create-*.log; do
            if [ "$(wc -c < "$l")" -gt 25000000 ]; then
              { head -c 20000000 "$l"; echo; echo '[... truncated ...]'; tail -c 1000000 "$l"; } > "$l.cut" && mv "$l.cut" "$l"
            fi
          done
          grep -a -v -E '^\s+VK_' logs/create-abs.log | tail -n 40
      - name: Steam bridge load (T3 without Steam; launcher -> forwarder -> lsteamclient.dll/.so)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e -uo pipefail
          mkdir -p logs
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          P="$RUNNER_TEMP/pfx-abs"
          [ -f "$P/system.reg" ] || PP_WINEDEBUG=-all to 180 bash "$R/share/peakpack/prefix/pp-create-prefix.sh" "$R" "$P" \
            > logs/bridge-prefix.log 2>&1
          tdir=$(mktemp -d); t=$(ls art/peakpack-steam-tests-*.tar.xz 2>/dev/null | head -1)
          [ -n "$t" ] && tar -xJf "$t" -C "$tdir"
          probe=$(find "$tdir" -name steam_client_probe.exe | head -1)
          d="$P/drive_c/PeakPackTests"; mkdir -p "$d"
          cp "$R/share/peakpack/steam/steamclient64.dll" "$R/share/peakpack/steam/peakpack_steam_launcher.exe" "$d/"
          [ -n "$probe" ] && cp "$probe" "$d/"
          ls -l "$d" "$R/lib/wine/x86_64-windows/lsteamclient.dll" "$R/lib/wine/x86_64-unix/lsteamclient.so"
          otool -L "$R/lib/wine/x86_64-unix/lsteamclient.so" > logs/lsteamclient-otool.txt 2>&1
          otool -l "$R/lib/wine/x86_64-unix/lsteamclient.so" | grep -A3 LC_RPATH >> logs/lsteamclient-otool.txt 2>&1
          cat logs/lsteamclient-otool.txt
          (
            # shellcheck source=/dev/null
            . "$R/share/peakpack/prefix/pp-env.sh"
            PP_WINEDEBUG="err+all,warn+module,+loaddll" pp_env "$R" "$P" logs >/dev/null
            to 120 "$WINELOADER" 'C:\PeakPackTests\peakpack_steam_launcher.exe' --forwarder-src 'C:\PeakPackTests\steamclient64.dll' \
              --log 'C:\PeakPackTests\launcher.log' -- 'C:\PeakPackTests\steam_client_probe.exe' > logs/t3-nosteam.log 2>&1
            echo "launcher exit $?"
            "$WINESERVER" -k 2>/dev/null
          )
          cp "$d/launcher.log" logs/t3-launcher.log 2>/dev/null
          grep -a -E '^RESULT|^\[peakpack-steam\]' logs/t3-nosteam.log | head -40
          grep -a -i -E 'lsteamclient|steamclient64|err:module|failed to load|status c0' logs/t3-nosteam.log \
            | grep -a -v -E '^\s+VK_' | head -40
      - name: D3D11 through DXMT (d3d11_clear.exe run as PEAK.exe, like G-A1)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e -uo pipefail
          mkdir -p logs
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          P="$RUNNER_TEMP/pfx-abs"
          tdir=$(mktemp -d); t=$(ls art/peakpack-steam-tests-*.tar.xz 2>/dev/null | head -1)
          [ -n "$t" ] && tar -xJf "$t" -C "$tdir"
          probe=$(find "$tdir" -name d3d11_clear.exe | head -1)
          [ -n "$probe" ] || { echo "no d3d11_clear.exe in the artifact's Steam test kit"; exit 0; }
          d="$P/drive_c/PeakPackTests/dxprobe"; mkdir -p "$d"; cp "$probe" "$d/PEAK.exe"
          (
            # shellcheck source=/dev/null
            . "$R/share/peakpack/prefix/pp-env.sh"
            PP_WINEDEBUG="err+all,+loaddll" pp_env "$R" "$P" logs >/dev/null
            to 120 "$WINELOADER" 'C:\PeakPackTests\dxprobe\PEAK.exe' --frames 300 --width 1280 --height 720 --hold-ms 3000 \
              > logs/d3d11-probe.log 2>&1
            echo "probe exit $?"
            "$WINESERVER" -k 2>/dev/null
          )
          tr -d '\r' < logs/d3d11-probe.log | grep -a -E '^RESULT' | head -40
          tr -d '\r' < logs/d3d11-probe.log | grep -a -i -E 'Loaded.*(d3d11|dxgi|winemetal)' | head -10
      - name: PeakPack --headless --status under Wine (inputs.peakpack_tag; crypto/TLS check)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e -uo pipefail
          mkdir -p logs
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          P="$RUNNER_TEMP/pfx-abs"
          u=$(ls "$P/drive_c/users" | grep -v -x -E 'Public|public|crossover' | head -1)
          ppd="$P/drive_c/users/$u/AppData/Local/PeakPack"; mkdir -p "$ppd" "$P/drive_c/Games/PEAK" "$P/drive_c/PeakPackTests"
          curl -fsSL -o "$ppd/PeakPack.exe" "https://github.com/jmproulx/peakpack/releases/download/$PPTAG/PeakPack.exe"
          curl -fsSL -o pp.sha256 "https://github.com/jmproulx/peakpack/releases/download/$PPTAG/PeakPack.exe.sha256"
          echo "PeakPack.exe $(shasum -a 256 "$ppd/PeakPack.exe" | cut -d' ' -f1) (release says: $(cut -c1-64 pp.sha256))"
          for run in plain debug; do
            (
              # shellcheck source=/dev/null
              . "$R/share/peakpack/prefix/pp-env.sh"
              dbg="err+all"; [ "$run" = debug ] && dbg="err+all,warn+bcrypt,+bcrypt,warn+secur32,warn+winhttp,warn+crypt"
              PP_WINEDEBUG="$dbg" pp_env "$R" "$P" logs >/dev/null
              ppexe="C:\\users\\$u\\AppData\\Local\\PeakPack\\PeakPack.exe"
              WINEDLLOVERRIDES="winhttp=n,b" to 300 "$WINELOADER" "$ppexe" --headless --status \
                --game-dir 'C:\Games\PEAK' --status-out "C:\\PeakPackTests\\status-$run.json" > "logs/peakpack-status-$run.log" 2>&1
              echo "PeakPack --status ($run) exit $?"
              "$WINESERVER" -k 2>/dev/null
            )
            cp "$P/drive_c/PeakPackTests/status-$run.json" logs/ 2>/dev/null && cat "logs/status-$run.json"
          done
          find "$ppd" -maxdepth 3 -type f \( -name '*.log' -o -name '*.txt' -o -name '*.json' \) -size -2M -exec cp {} logs/ \; 2>/dev/null
          ls -la "$ppd"
          grep -a -v -E '^\s+VK_' logs/peakpack-status-plain.log | tail -n 30
          grep -a -i -E 'bcrypt|ecdsa|ecc|gnutls|schannel|secur32|err:' logs/peakpack-status-debug.log | grep -a -v -E '^\s+VK_' | head -60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: smoke-logs-${{ inputs.run_id }}
          path: logs
          retention-days: 7
