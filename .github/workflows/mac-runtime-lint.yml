# Fast static checks for mac/runtime (no builds, no secrets, read-only).
# Repo path when pushed: .github/workflows/mac-runtime-lint.yml
name: mac-runtime-lint

on:
  push:
    paths:
      - "mac/runtime/**"
      - "mac/testkit/**"
      - ".github/workflows/mac-runtime*.yml"
      - ".github/workflows/mac-steam-tests.yml"
      - ".github/workflows/mac-bepinex5.yml"
  pull_request:
    paths:
      - "mac/runtime/**"
      - "mac/testkit/**"
      - ".github/workflows/mac-runtime*.yml"
      - ".github/workflows/mac-steam-tests.yml"
      - ".github/workflows/mac-bepinex5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n + shellcheck
        run: |
          set -euo pipefail
          # Per folder: each folder's `source` directives are relative to it (run from the repo root, shellcheck
          # cannot follow mac/testkit's lib and reports its variables as unused, SC2034).
          for d in mac/runtime mac/testkit; do
            [ -d "$d" ] || continue
            files="$(cd "$d" && find . -name '*.sh')"   # mac/runtime includes steam/ (R5)
            for f in $files; do bash -n "$d/$f"; done
            # ShellCheck comes preinstalled on the ubuntu runner image. Word splitting of $files is intended.
            # shellcheck disable=SC2086
            (cd "$d" && shellcheck -x -S warning $files)
          done
      - name: no mod-loader artifacts in the depot reference lists (testkit/expect)
        run: |
          set -euo pipefail
          re='^[0-9a-f]{64}  [0-9]+  (BepInEx/|doorstop_libs/|MelonLoader/|changelog\.txt$|\.doorstop_version$'
          re="$re"'|doorstop_config\.ini$|winhttp\.dll$|libdoorstop\.|run_bepinex\.sh$)'
          if grep -n -E "$re" mac/testkit/expect/*.manifest; then
            echo "::error::mod-loader file in a reference manifest (regenerate with runtime/steam/tests/depot_manifest.sh)"; exit 1
          fi
      - name: run_gate stop/restart in one job dir (runner_restart_test.sh)
        run: bash mac/testkit/tests/runner_restart_test.sh
      - name: test kit's copy of verify_runtime.sh is identical
        run: cmp mac/runtime/build/verify_runtime.sh mac/testkit/lib/verify_runtime.sh
      - name: yamllint
        run: |
          pip3 install --user --break-system-packages yamllint==1.35.1
          cfg='{extends: default, rules: {line-length: {max: 140}, truthy: {check-keys: false}, document-start: disable}}'
          ~/.local/bin/yamllint -d "$cfg" .github/workflows/mac-runtime*.yml .github/workflows/mac-steam-tests.yml \
            .github/workflows/mac-bepinex5.yml
      - name: python compile
        run: |
          python3 -I -m py_compile mac/runtime/build/manifest.py
          python3 -I -m py_compile mac/runtime/steam/src/forwarder/verify_forwarder.py
      - name: .reg files are REGEDIT4 ASCII
        run: |
          for f in mac/runtime/prefix/reg/*.reg; do
            head -n 1 "$f" | grep -qx 'REGEDIT4' || { echo "$f: bad header"; exit 1; }
          done
          python3 -I -c 'import sys; [open(f, "rb").read().decode("ascii") for f in sys.argv[1:]]' mac/runtime/prefix/reg/*.reg
